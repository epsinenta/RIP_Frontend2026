name: Deploy to gh-pages

on:
  push:
    branches:
      - main
      - lab8-tauri-pwa

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /org-structure-frontend/
          # Пустой origin → в бандле /api; реальный URL подставляет postbuild (runtime-config + патч).
          VITE_API_ORIGIN: ""
          VITE_MINIO_PUBLIC_BASE: ${{ vars.VITE_MINIO_PUBLIC_BASE }}
        run: npm run build

      - name: Runtime API for GitHub Pages
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: |
          node scripts/postbuild-pages-api.mjs
          if [ -z "$VITE_API_ORIGIN" ]; then
            echo "::error::Для деплоя на GitHub Pages задайте переменную репозитория VITE_API_ORIGIN (HTTPS-URL API, доступный из интернета: VPS/Railway или туннель ngrok/Cloudflare — с https:// страницы github.io нельзя вызывать http://localhost)."
            exit 1
          fi
          if [[ ! "$VITE_API_ORIGIN" =~ ^https:// ]]; then
            echo "::error::VITE_API_ORIGIN должен начинаться с https:// (http:// будет заблокирован как mixed content на github.io)."
            exit 1
          fi
          if [[ "$VITE_API_ORIGIN" =~ ^https://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:[0-9]+)?(/|$) ]]; then
            echo "::error::VITE_API_ORIGIN не может указывать на localhost/127.0.0.1 для GitHub Pages — это браузер не сможет использовать с https://*.github.io."
            exit 1
          fi
          if [[ "$VITE_API_ORIGIN" =~ ^https://[^/]*github\.io(/|$) ]]; then
            echo "::error::VITE_API_ORIGIN указывает на github.io, из-за этого запросы идут в https://...github.io/api. Укажи публичный HTTPS URL именно backend API."
            exit 1
          fi

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          branch: gh-pages
          force_orphan: true
